<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudstitch · 하늘 풍경 비교</title>
<style>
:root{color-scheme:light;font:15px/1.7 system-ui,sans-serif;color:#34594e;background:#e7ede1}*{box-sizing:border-box}body{margin:0;padding:32px 20px 50px}main{max-width:1180px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font:600 clamp(24px,4vw,38px) Georgia,serif;letter-spacing:-1px;margin:0}p{margin:5px 0 0;color:#6b7d68;font-size:13px}a{display:inline-block;color:#fff5db;background:#477b68;padding:11px 20px;border-radius:8px;text-decoration:none;white-space:nowrap}figure{margin:0;border:1px solid #c4c6a5;border-radius:14px;overflow:hidden;background:#d1e0d7;box-shadow:0 10px 40px #355c4c16}.comparison{position:relative;aspect-ratio:1440/900;--split:50%}.comparison img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.before{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#fff5d9;box-shadow:0 0 10px #244c4544;pointer-events:none}.divider:after{content:'↔';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff5dd;border:1px solid #cbb279;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;color:#5d755f}.badge{position:absolute;top:14px;font-size:12px;padding:4px 12px;background:#fff8e7e8;border:1px solid #cbc7a5;border-radius:20px}.old{left:14px}.new{right:14px}.slider{display:flex;align-items:center;gap:15px;background:#faf5e3;padding:16px 20px}.slider label{font-size:12px;white-space:nowrap}.slider input{width:100%;accent-color:#4c8069;cursor:ew-resize}section{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}section figure img{display:block;width:100%}figcaption{padding:12px 16px;font-size:12px;background:#f8f3df}footer{margin-top:22px;font-size:12px;color:#6b7d68}@media(max-width:650px){body{padding:20px 12px}header{align-items:flex-start;flex-direction:column}section{grid-template-columns:1fr}.badge{top:7px;font-size:10px;padding:2px 9px}.slider{padding:10px;gap:8px}.slider label{font-size:10px}}
</style>
<main><header><div><h1>Cloudstitch · 풍성한 하늘</h1><p>같은 위치와 시점의 풍경입니다. 손잡이를 움직여 비교해 보세요.</p></div><a href="../flight3d-v1/index.html">직접 날아보기 ↗</a></header>
<figure><div class="comparison" id="comparison"><img src="preview-after.png" alt="겹겹의 구름층과 공중 생활 소품이 있는 새 풍경"><img class="before" src="preview-before.png" alt="간결한 기존 풍경"><span class="badge old">이전 풍경</span><span class="badge new">풍성한 하늘</span><i class="divider" aria-hidden="true"></i></div><div class="slider"><label for="split">이전 ←</label><input id="split" aria-label="이전 풍경이 보이는 너비" type="range" min="0" max="100" value="50"><label for="split">→ 새 풍경</label></div></figure>
<section><figure><img src="preview-motion.png" alt="전진하며 구름층으로 상승한 실제 비행 화면"><figcaption>W로 전진하고 Q로 상승 · 가까운 표식과 먼 섬의 거리 차이</figcaption></figure><figure><img src="preview-mobile.png" alt="작은 화면에서 새 풍경과 비행선을 둘러보는 모습"><figcaption>좁은 화면에서도 둘러볼 수 있는 입체 풍경</figcaption></figure></section>
<footer>W/S 전후진 · A/D 선회 · Q/E 상승·하강 · 화면 잡아 끌기 · Space 제동<br>게임의 ? 안내에서 풍경을 풍성하게 또는 간결하게 바꿀 수 있습니다.</footer></main>
<script>document.getElementById('split').addEventListener('input',e=>document.getElementById('comparison').style.setProperty('--split',e.target.value+'%'));</script></html>
