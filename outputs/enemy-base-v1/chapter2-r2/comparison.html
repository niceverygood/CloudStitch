<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1탄과 2탄 기지 비교 · Cloudstitch</title><style>body{margin:0;padding:25px;background:#f3efe6;color:#343442;font:14px/1.8 sans-serif}h1{font:32px Georgia,Batang,serif}a{color:inherit}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:#eee8dd;border:1px solid #cbc2b9}img{width:100%;display:block;background:linear-gradient(#b5acbc,#e3d1c3)}figcaption{padding:16px}p{max-width:1000px}@media(max-width:760px){section{grid-template-columns:1fr}}</style><h1>철갑의 성채에서, 적조의 왕관으로.</h1><p>1탄의 철갑과 첨탑 대신, 2탄은 나선 패각·뼈 방벽·붉은 산호·진주층 도시·발광 항구로 구성했습니다. 두 실제 GLB의 동일 입체 방향/손그림/윤곽1.5/전체화면 맞춤 렌더입니다. 절대 미터 스케일 비교가 아닙니다.</p><a href="index.html">2탄 3D 검수 ↗</a> · <a href="../dense-r4/index.html">1탄 3D 검수 ↗</a><section><figure><img src="chapter1-iso.png" alt="1탄 실제 3D"><figcaption>1탄 · 철갑과 비대칭 첨탑 성채</figcaption></figure><figure><img src="model-iso.png" alt="2탄 실제 3D"><figcaption>2탄 · 나선 패각과 포식자의 발광 항구</figcaption></figure></section><p>실제 3D 아트 에셋의 비교이며 게임 전투/스탯/소켓/성능 승인은 포함하지 않습니다. 원화 세부와 숨은 구조에는 해석이 포함됩니다.</p></html>
