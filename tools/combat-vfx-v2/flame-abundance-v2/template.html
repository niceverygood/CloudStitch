<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Cloudstitch · 풍성한 화염 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e5d7;color:#365c55;font:14px system-ui,'Malgun Gothic',sans-serif}main{max-width:1680px;margin:auto;padding:20px}h1{font-size:26px;margin:6px 0}p,footer{font-size:12px;line-height:1.6;color:#7f927e}small{letter-spacing:2px;color:#8d9a85}.panel{border:1px solid #c9d2be;border-radius:15px;background:#faf8ee;overflow:hidden}.bar{padding:13px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,a{font:inherit;font-size:12px;color:inherit;background:#faf9f0;border:1px solid #c2cfb9;padding:8px 12px;border-radius:6px;text-decoration:none;cursor:pointer}button.primary{background:#4d7c67;color:#fff}.grow{flex:1}.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ced5c3}.lane{position:relative;height:61vh;min-height:450px;background:radial-gradient(ellipse,#fffdf2,#ecebdb)}.lane.dusk{background:radial-gradient(ellipse,#365e68,#233e4c)}canvas{display:block;width:100%;height:100%}.label{position:absolute;top:15px;left:16px;background:#f8f5e5df;padding:7px 12px;border-radius:5px;font-size:12px}.lane.dusk .label{color:#dce2c7;background:#223d49c9}#timeline{min-width:140px;flex:1;accent-color:#698d6d}footer{padding:0 16px 15px;margin:0}#status{font-size:11px;color:#9a804d}@media(max-width:700px){main{padding:10px}h1{font-size:21px}.compare{grid-template-columns:1fr}.lane{height:43vh;min-height:330px}.bar{padding:10px;gap:7px}}
</style><main><small>CLOUDSTITCH · ABUNDANT FIRE</small><h1>거대한 불꽃 · 발사부터 여운까지</h1><p>백열 코어 · 겹겹의 화염 혀 · 치솟는 나선 불길 · 흩날리는 불티 · 번지는 잔불과 연기</p><section class="panel"><div class="bar"><label>무기 <select id="weapon" aria-label="무기 선택"></select></label><label>배경 <select id="background"><option value="cream">크림</option><option value="dusk">푸른 저녁</option></select></label><span class="grow"></span><a id="download" download>새 애니메이션 GLB 다운로드</a></div><div class="compare"><div class="lane" id="before"><span class="label">이전 효과</span></div><div class="lane" id="after"><span class="label">새 화염 · 같은 카메라와 시간</span></div></div><div class="bar"><button class="primary" id="play">재생</button><button id="reset">처음부터</button><button id="fire">발사</button><button id="crest">화염 절정</button><button id="settle">잔불·연기</button><button id="fit">전체 맞춤</button><input type="range" id="timeline" aria-label="재생 시간" min="0" max="4.2" step=".005" value="1.9"><span id="time"></span><label>속도 <select id="speed"><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option></select></label></div><footer><span id="status">GLB를 불러오는 중…</span><br>독립적인 손그림 3D 화염 시안입니다. 기존 무기·화염 원본은 보존합니다. 두 장면은 같은 시점으로 비교하며, 효과 때문에 카메라가 자동으로 멀어지지 않습니다. GLB에 표준 위치·회전·크기 애니메이션을 포함합니다. 실제 전투 판정과 음향은 별도입니다.</footer></section></main><script>/* BUNDLE */</script></html>
