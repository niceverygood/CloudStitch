<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
  <title>Cloudstitch · 무기 작업대</title>
  <style>
    :root{font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:#29464a;background:#eae7dc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{cursor:pointer}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a29b;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.4}
    .shell{max-width:1440px;margin:auto;padding:26px 30px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:2.6px;color:#7c8a80;margin-bottom:8px}h1{margin:0;font-size:27px;letter-spacing:-1px}h1 span{font-size:15px;color:#80908a;font-weight:400;margin-left:12px}.download{color:#3d625e;background:#f9f7ed;border:1px solid #bfc9bc;border-radius:8px;padding:11px 15px;text-decoration:none;white-space:nowrap;font-size:12px}.download[aria-disabled=true]{opacity:.4;pointer-events:none}
    main{background:#fbf9f1;border:1px solid #cbcfc3;border-radius:15px;box-shadow:0 12px 36px #34504a10;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid #dde0d4;flex-wrap:wrap}.picker{display:flex;gap:12px;align-items:center;font-size:12px;color:#71877f}.picker select{min-width:230px;max-width:100%;border:1px solid #c7d1c6;border-radius:6px;background:#fdfbf3;color:#31524f;padding:9px 28px 9px 11px}.segmented{display:flex;gap:3px;padding:4px;background:#e8ede3;border-radius:8px}.mode{border:0;border-radius:6px;padding:8px 14px;color:#6d817b;background:transparent;font-size:12px;white-space:nowrap}.mode[aria-pressed=true]{background:#3d655f;color:#fff}
    .stage{position:relative;width:100%;height:min(65vh,650px);min-height:380px;overflow:hidden;background:radial-gradient(ellipse at 48% 40%,#fffdf4 0%,#f6f3e8 65%,#eae8db 100%)}canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.stage-label{position:absolute;top:24px;left:25px;z-index:1;pointer-events:none;max-width:50%}.stage-label strong{font-size:14px;color:#53736a;font-weight:600}.stage-label p{font-size:11px;color:#91a094;margin:6px 0}.tools{position:absolute;right:20px;top:20px;display:flex;gap:6px;z-index:2}.tool{padding:9px 11px;color:#5f7b71;border:1px solid #cbd5c7;background:#fcfaf1e8;border-radius:6px;font-size:11px}.tool[aria-pressed=true]{background:#648379;color:white;border-color:#648379}.caption{position:absolute;bottom:19px;left:25px;font-size:11px;color:#93a08f;pointer-events:none}.loading{position:absolute;inset:0;z-index:3;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:16px;background:#f7f4e9;color:#698276;font-size:13px;padding:25px;text-align:center}.loading[hidden]{display:none}.spinner{width:25px;height:25px;border-radius:50%;border:2px solid #d4ddcb;border-top-color:#6e8b7b;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error .spinner{display:none}
    .controls{padding:17px 23px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #dde0d4;flex-wrap:wrap}.view-options{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.toggle{display:flex;align-items:center;gap:6px;color:#58776a;font-size:12px;cursor:pointer}.toggle input{accent-color:#477665;width:15px;height:15px}.range{display:flex;align-items:center;gap:8px;color:#819083;font-size:11px}.range input{accent-color:#75907c;width:90px}.range output{min-width:25px;font-variant-numeric:tabular-nums}.mount-controls{display:flex;gap:19px;flex-wrap:wrap}.mount-controls[hidden]{display:none}.mode-info{font-size:12px;color:#668274}.mode-info strong{color:#3d6459}.mode-info p{font-size:11px;margin:5px 0 0;color:#91a08f}
    .details{display:flex;align-items:flex-start;gap:20px;padding:20px 23px;border-top:1px dashed #d8dacb}.details img{width:115px;height:95px;object-fit:contain;border:1px solid #dfdfce;border-radius:7px;background:#f3f0e4}.details img[hidden]{display:none}.details-copy{flex:1;min-width:0}.details h2{font-size:15px;margin:0 0 7px;color:#466d60}.details p{font-size:12px;line-height:1.75;color:#899786;margin:4px 0}.details .note{color:#a08d70;font-size:11px}.badge{font-size:10px;letter-spacing:.4px;color:#879781;margin:7px 0}footer{display:flex;justify-content:space-between;gap:15px;padding:16px 3px 0;font-size:10px;color:#91a08c;line-height:1.8}
    @media(max-width:760px){.shell{padding:19px 12px}header{gap:10px;margin-bottom:17px}h1{font-size:22px}h1 span{display:block;font-size:11px;margin:5px 0 0}.eyebrow{font-size:8px;letter-spacing:1.8px}.download{font-size:10px;padding:10px}.toolbar{padding:12px}.picker{width:100%;gap:9px}.picker select{flex:1;min-width:0}.segmented{width:100%;justify-content:space-between}.mode{flex:1;font-size:11px;padding:8px 9px}.stage{height:55vh;min-height:350px}.stage-label{top:18px;left:17px;max-width:90%}.stage-label strong{font-size:12px}.stage-label p{font-size:10px}.tools{top:auto;bottom:45px;right:12px;gap:4px}.tool{padding:8px;font-size:10px}.caption{left:17px;bottom:17px;font-size:9px}.controls{padding:14px;gap:15px}.view-options{gap:11px;justify-content:space-between;width:100%}.toggle{font-size:11px}.range{font-size:10px}.range input{width:72px}.details{padding:16px;gap:13px}.details img{width:80px;height:80px}.details h2{font-size:13px}.details p{font-size:11px}.details .note{font-size:10px}footer{font-size:9px;flex-direction:column;gap:2px}.mount-controls{gap:12px}.mode-info p{max-width:310px}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="eyebrow">CLOUDSTITCH · HANDCRAFTED ARSENAL</div><h1>무기 작업대 <span>형태는 3D, 분위기는 손그림</span></h1></div><a class="download" id="download" aria-disabled="true" download>선택 무기 GLB</a></header>
    <main>
      <nav class="toolbar" aria-label="무기와 표시 방식"><label class="picker">무기 선택 <select id="weapon-select" aria-label="무기 선택"></select></label><div class="segmented"><button class="mode" data-mode="handdrawn" aria-pressed="true">손그림</button><button class="mode" data-mode="cel" aria-pressed="false">셀 명암</button><button class="mode" data-mode="original" aria-pressed="false">원본 재질</button></div></nav>
      <section id="stage" class="stage" aria-label="회전 가능한 무기 3D 모델"><div class="stage-label"><strong id="stage-title">무기를 준비하고 있습니다</strong><p id="stage-description">따뜻한 목재 · 청록색 기계 · 황동 장식</p></div><div class="tools"><button class="tool" id="reset">처음 시점</button><button class="tool" id="fit">화면 맞춤</button><button class="tool" id="rotate" aria-pressed="false">자동 회전</button></div><div class="caption">드래그 회전 · 휠 확대 · 오른쪽 드래그 이동</div><div class="loading" id="loading" role="status"><div class="spinner"></div><span id="loading-text">3D 모델과 손그림 재질을 준비하고 있습니다</span></div></section>
      <div class="controls"><div class="mode-info"><strong id="mode-title">손그림</strong><p id="mode-description">텍스처의 색과 선을 편안하게 보여줍니다.</p></div><div class="view-options"><label class="toggle"><input id="mounted" type="checkbox">장착 배치</label><label class="toggle"><input id="outline" type="checkbox" checked>윤곽선</label><label class="range">선 두께 <input id="thickness" type="range" min="0.5" max="3.5" step="0.1" value="1.2"><output id="thickness-value">1.2</output></label></div><div class="mount-controls" id="mount-controls" hidden><label class="range">방향 <input id="yaw" type="range" min="-180" max="180" step="5" value="0"><output id="yaw-value">0°</output></label><label class="range">크기 <input id="mount-scale" type="range" min="0.5" max="2" step="0.05" value="1"><output id="mount-scale-value">1.00</output></label></div></div>
      <section class="details"><img id="reference" alt="선택 무기의 손그림 디자인 기준" hidden><div class="details-copy"><h2 id="weapon-name">무기</h2><div id="weapon-english" class="badge"></div><p id="weapon-description"></p><p class="note" id="mount-note">독립 무기 원형입니다. 게임용 부품 분리·피벗·장착 소켓·발사 동작은 후속 작업입니다.</p></div></section>
    </main>
    <footer><span id="model-stats">완료한 실제 모델만 표시합니다</span><span>정투영 시점 · 모델과 텍스처 내장 · 오프라인 작업대</span></footer>
  </div>
  <script>/* BUNDLED_WORKBENCH */</script>
</body>
</html>
